<!DOCTYPE html>
<html lang="en" data-season="spring" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stardew or Dew Not 🌾</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4C1CB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
/* ── KAWAII Y2K PASTEL THEME ── */
:root{
  --bg:#F4DBE8;--surf:#F4C1CB;--text:#3d1f3d;--muted:#A07888;
  --border:#EF94A7;--acc:#EF94A7;--acc2:#B29EF0;
  --blush:#e36887;--butter:#f3d98f;
  --hdr-a:#F4C1CB;--hdr-b:#DCBFF2;
  --nav-bg:rgba(244,193,203,0.97);--nav-act:#EF94A7;
  --r:20px;--gap:12px;
  --t-fire:#e36887;--t-prep:#f3d98f;--t-gather:#AABFB0;
  --t-plate:#DCBFF2;--t-purchase:#AAC0E0;--t-par:#D4A820;--t-tomorrow:#C7D3E0;
  --shadow-bubble:0 8px 32px rgba(239,148,167,.16),0 2px 8px rgba(239,148,167,.08);
  --shadow-card:0 4px 16px rgba(239,148,167,.10);
  --shadow-glow:0 0 18px rgba(239,148,167,.5);
  --inset-shine:inset 0 1px 0 rgba(255,255,255,.7);
}
html[data-season=summer]{
  --bg:#C5DDD6;--surf:#ADE6DC;--acc:#AABFB0;--acc2:#EFCEAA;
  --hdr-a:#ADE6DC;--hdr-b:#EFCEAA;--nav-act:#AABFB0;
  --nav-bg:rgba(173,230,220,0.97);
  --shadow-bubble:0 4px 20px rgba(170,191,176,.2),0 1px 5px rgba(170,191,176,.12);
  --shadow-glow:0 0 14px rgba(170,191,176,.5);
}
html[data-season=fall]{
  --bg:#EFCEAA;--surf:#f3d98f;--acc:#CAAF77;--acc2:#F4C1CB;
  --hdr-a:#f3d98f;--hdr-b:#EFCEAA;--nav-act:#CAAF77;
  --nav-bg:rgba(243,217,143,0.97);
  --shadow-bubble:0 4px 20px rgba(202,175,119,.2),0 1px 5px rgba(202,175,119,.12);
  --shadow-glow:0 0 14px rgba(202,175,119,.5);
}
html[data-season=winter]{
  --bg:#C7D3E0;--surf:#DCBFF2;--acc:#89A6D3;--acc2:#B29EF0;
  --hdr-a:#DCBFF2;--hdr-b:#C7D3E0;--nav-act:#89A6D3;
  --nav-bg:rgba(220,191,242,0.97);
  --shadow-bubble:0 4px 20px rgba(137,166,211,.2),0 1px 5px rgba(137,166,211,.12);
  --shadow-glow:0 0 14px rgba(137,166,211,.5);
}
html[data-dark=true]{
  --bg:#160c26;--surf:#201038;--text:#f4e8ff;--muted:#9878c0;
  --border:#3a1c56;--nav-bg:rgba(14,6,28,0.98);
  --hdr-a:#281450;--hdr-b:#1c0c3a;
  --shadow-bubble:0 4px 20px rgba(120,60,200,.28),0 1px 5px rgba(120,60,200,.18);
  --shadow-glow:0 0 16px rgba(184,152,224,.6);
  --inset-shine:inset 0 1px 0 rgba(255,255,255,.1);
}

/* ── PER-TAB COLOR THEMES ── */
/* Route 66 — warm gold/butter */
html[data-tab=route]{
  --bg:#EFCEAA;--surf:#f3d98f;
  --acc:#CAAF77;--acc2:#f3d98f;--nav-act:#CAAF77;
  --hdr-a:#f3d98f;--hdr-b:#EFCEAA;
  --nav-bg:rgba(243,217,143,0.97);
  --shadow-bubble:0 8px 32px rgba(202,175,119,.2),0 2px 8px rgba(202,175,119,.12);
  --shadow-glow:0 0 18px rgba(202,175,119,.5);
}
/* The Hoard — sage green */
html[data-tab=hoard]{
  --bg:#C5DDD6;--surf:#ADE6DC;
  --acc:#AABFB0;--acc2:#91D5D8;--nav-act:#AABFB0;
  --hdr-a:#ADE6DC;--hdr-b:#C5DDD6;
  --nav-bg:rgba(173,230,220,0.97);
  --shadow-bubble:0 8px 32px rgba(170,191,176,.2),0 2px 8px rgba(170,191,176,.12);
  --shadow-glow:0 0 18px rgba(170,191,176,.5);
}
/* Story Time — soft lavender */
html[data-tab=story]{
  --bg:#C1C1E4;--surf:#DCBFF2;
  --acc:#B29EF0;--acc2:#DCBFF2;--nav-act:#B29EF0;
  --hdr-a:#DCBFF2;--hdr-b:#C1C1E4;
  --nav-bg:rgba(220,191,242,0.97);
  --shadow-bubble:0 8px 32px rgba(178,158,240,.2),0 2px 8px rgba(178,158,240,.12);
  --shadow-glow:0 0 18px rgba(178,158,240,.5);
}
/* Big Daddy Nightlock — blush rose */
html[data-tab=nightlock]{
  --bg:#F4DBE8;--surf:#F4C1CB;
  --acc:#e36887;--acc2:#F4C1CB;--nav-act:#e36887;
  --hdr-a:#F4C1CB;--hdr-b:#EDBDBC;
  --nav-bg:rgba(244,193,203,0.97);
  --shadow-bubble:0 8px 32px rgba(227,104,135,.2),0 2px 8px rgba(227,104,135,.12);
  --shadow-glow:0 0 18px rgba(227,104,135,.5);
}

/* ── Per-sub-tab color overrides ──────────────────────────────────────────── */
/* Route 66 sub-tabs */
html[data-tab=route][data-sub=prep]{--bg:#F4C1CB;--surf:#EF94A7;--acc:#e36887;--nav-bg:rgba(239,148,167,.97);}
html[data-tab=route][data-sub=cal]{--bg:#EFCEAA;--surf:#f3d98f;--acc:#CAAF77;--nav-bg:rgba(243,217,143,.97);}
html[data-tab=route][data-sub=par]{--bg:#C5DDD6;--surf:#ADE6DC;--acc:#AABFB0;--nav-bg:rgba(173,230,220,.97);}
html[data-tab=route][data-sub=forget]{--bg:#C1C1E4;--surf:#DCBFF2;--acc:#B29EF0;--nav-bg:rgba(220,191,242,.97);}
/* Hoard sub-tabs */
html[data-tab=hoard][data-sub=junimo]{--bg:#C5DDD6;--surf:#ADE6DC;--acc:#AABFB0;--nav-bg:rgba(173,230,220,.97);}
html[data-tab=hoard][data-sub=quests]{--bg:#EFCEAA;--surf:#f3d98f;--acc:#CAAF77;--nav-bg:rgba(243,217,143,.97);}
html[data-tab=hoard][data-sub=museum]{--bg:#DCBFF2;--surf:#B29EF0;--acc:#8B70D8;--nav-bg:rgba(178,158,240,.97);}
html[data-tab=hoard][data-sub=unlocks]{--bg:#AABFB0;--surf:#C5DDD6;--acc:#7AA08A;--nav-bg:rgba(197,221,214,.97);}
html[data-tab=hoard][data-sub=covenant]{--bg:#F4DBE8;--surf:#F4C1CB;--acc:#EF94A7;--nav-bg:rgba(244,193,203,.97);}
/* Story sub-tabs */
html[data-tab=story][data-sub=previously]{--bg:#C1C1E4;--surf:#DCBFF2;--acc:#B29EF0;--nav-bg:rgba(220,191,242,.97);}
html[data-tab=story][data-sub=lore]{--bg:#C7D3E0;--surf:#AAC0E0;--acc:#89A6D3;--nav-bg:rgba(170,192,224,.97);}
html[data-tab=story][data-sub=covenant]{--bg:#F4DBE8;--surf:#F4C1CB;--acc:#EF94A7;--nav-bg:rgba(244,193,203,.97);}
html[data-tab=story][data-sub=mainquest]{--bg:#F4C1CB;--surf:#EF94A7;--acc:#e36887;--nav-bg:rgba(239,148,167,.97);}
html[data-tab=story][data-sub=milestones]{--bg:#EFCEAA;--surf:#f3d98f;--acc:#CAAF77;--nav-bg:rgba(243,217,143,.97);}
html[data-tab=story][data-sub=odds]{--bg:#AABFB0;--surf:#C5DDD6;--acc:#7AA08A;--nav-bg:rgba(197,221,214,.97);}
/* Nightlock sub-tabs */
html[data-tab=nightlock][data-sub=tardis]{--bg:#DCBFF2;--surf:#B29EF0;--acc:#8B70D8;--nav-bg:rgba(178,158,240,.97);}
html[data-tab=nightlock][data-sub=davy]{--bg:#C7D3E0;--surf:#AAC0E0;--acc:#89A6D3;--nav-bg:rgba(170,192,224,.97);}
html[data-tab=nightlock][data-sub=fit]{--bg:#F4C1CB;--surf:#EF94A7;--acc:#e36887;--nav-bg:rgba(239,148,167,.97);}
html[data-tab=nightlock][data-sub=skills]{--bg:#C5DDD6;--surf:#ADE6DC;--acc:#AABFB0;--nav-bg:rgba(173,230,220,.97);}
html[data-tab=nightlock][data-sub=grass]{--bg:#AABFB0;--surf:#C5DDD6;--acc:#7AA08A;--nav-bg:rgba(197,221,214,.97);}
html[data-tab=nightlock][data-sub=recipes]{--bg:#EFCEAA;--surf:#f3d98f;--acc:#CAAF77;--nav-bg:rgba(243,217,143,.97);}
html[data-tab=nightlock][data-sub=cast]{--bg:#F4DBE8;--surf:#F4C1CB;--acc:#EF94A7;--nav-bg:rgba(244,193,203,.97);}
html[data-tab=nightlock][data-sub=plot]{--bg:#C1C1E4;--surf:#DCBFF2;--acc:#B29EF0;--nav-bg:rgba(220,191,242,.97);}
html[data-tab=nightlock][data-sub=holocron]{--bg:#AAC0E0;--surf:#C7D3E0;--acc:#89A6D3;--nav-bg:rgba(199,211,224,.97);}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
*{-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;overflow:hidden;}

/* ── TICKER ── */
#ticker{
  background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  font-weight:700;font-size:15px;flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:none;
  box-shadow:0 4px 20px rgba(239,148,167,.18);
  position:relative;z-index:2;
}
#ticker-left{display:flex;align-items:center;gap:8px;}
#ticker-logo{height:34px;width:auto;}
#ticker-subtitle{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--text);opacity:.8;white-space:nowrap;}
.home-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px 8px;text-align:center;}
.home-logo{width:min(320px,88vw);height:auto;image-rendering:pixelated;filter:drop-shadow(0 4px 12px rgba(0,0,0,.18));}
.home-subtitle{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--acc);letter-spacing:1px;line-height:1.6;}
#ticker-text{font-family:'Press Start 2P',monospace;font-size:7px;letter-spacing:.3px;line-height:1.6;}
#ticker-right{display:flex;gap:10px;align-items:center;}
img.sdv-icon{image-rendering:pixelated;display:block;}
.nav-btn .icon.sdv-icon{width:26px;height:26px;margin:0 auto;}
.sub-btn .sdv-icon{width:14px;height:14px;margin-right:4px;display:inline-block;vertical-align:middle;}
#dark-btn{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:0;line-height:1;}
#bridge-dot{width:10px;height:10px;border-radius:50%;background:#e06868;flex-shrink:0;
  box-shadow:0 0 0 2px rgba(255,255,255,0.45);transition:background .4s;}
#bridge-dot.ok{background:#58c880;}
#bridge-dot.stale{background:#e0b040;}
#bridge-sync-time{font-size:9px;color:var(--muted);letter-spacing:-.2px;}
#schema-banner{display:none;background:#e0b040;color:#3a1f3a;font-size:11px;font-weight:700;
  text-align:center;padding:4px 12px;flex-shrink:0;}

/* ── PANELS ── */
#main{flex:1;overflow:hidden;position:relative;z-index:1;}
.panel{position:absolute;inset:0;overflow-y:auto;padding:var(--gap);display:none;
  -webkit-overflow-scrolling:touch;}
.panel.active{display:block;}
.panel-title{font-family:'Press Start 2P',monospace;font-size:9px;font-weight:400;
  margin-bottom:14px;color:var(--acc);letter-spacing:.5px;line-height:1.9;
  display:flex;align-items:center;gap:8px;}
.panel-title img{width:22px;height:22px;image-rendering:pixelated;flex-shrink:0;}

/* ── BOTTOM NAV ── */
#nav{display:flex;background:var(--nav-bg);border-top:none;
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 -4px 20px rgba(239,148,167,.14);
  position:relative;z-index:2;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:7px 2px 8px;background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:9px;font-weight:600;position:relative;transition:color .2s;}
.nav-btn .icon{font-size:20px;line-height:1.2;transition:transform .2s;}
.nav-btn.active{color:var(--acc);}
.nav-btn.active .icon{transform:scale(1.12);}
.nav-btn.active::after{content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 4px 4px;
  background:var(--acc);box-shadow:0 0 8px var(--acc);}
.nav-btn:active{transform:scale(0.92);}

/* ── SUB-NAV ── */
.sub-nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1px;}
.sub-nav::-webkit-scrollbar{display:none;}
.sub-btn{flex-shrink:0;background:var(--surf);border:1.5px solid var(--border);
  border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit;
  box-shadow:0 2px 6px rgba(239,148,167,.08),var(--inset-shine);}
.sub-btn.active{background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));
  color:var(--text);border-color:var(--acc);font-weight:700;
  box-shadow:0 3px 12px rgba(239,148,167,.28),var(--inset-shine);}
.sub-btn:active{transform:scale(0.94);}
.sub-panel{display:none;}
.sub-panel.active{display:block;}

/* ── SHARED CARD ── */
.card{background:var(--surf);border:none;border-radius:var(--r);
  overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-bubble);}
.card-header{background:var(--surf);
  padding:14px 16px 6px;font-weight:800;font-size:13px;color:var(--acc);}
.card-body{padding:12px 14px;}

/* ── ROUTE DAY CARDS ── */
.route-day{background:var(--surf);border-radius:var(--r);border:none;
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-bubble);}
.route-day.today{box-shadow:var(--shadow-glow),var(--shadow-bubble);}
.day-header{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;
  user-select:none;background:var(--surf);
  border-bottom:none;}
.route-day[data-open=true] .day-header{border-bottom:none;}
.day-num{background:var(--acc);color:#fff;border-radius:8px;padding:2px 8px;
  font-size:12px;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums;}
.route-day.today .day-num{background:var(--acc2);}
.day-name{flex:1;font-size:13.5px;font-weight:700;}
.day-event{font-size:10px;background:var(--acc2);color:#fff;border-radius:10px;
  padding:2px 7px;flex-shrink:0;font-weight:600;}
.day-arrow{color:var(--muted);font-size:11px;transition:transform .25s;flex-shrink:0;}
.route-day[data-open=true] .day-arrow{transform:rotate(90deg);}
.day-body{display:none;}
.route-day[data-open=true] .day-body{display:block;}

/* ── TASK ROWS ── */
.task-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc);
  background:var(--bg);flex-shrink:0;cursor:pointer;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:all .18s;}
.task-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);
  box-shadow:0 0 8px rgba(239,148,167,.5);}
.task-check[data-checked="1"]::after{content:'✦';color:#fff;font-size:11px;}
.task-check:active{transform:scale(0.88);}
.task-label{flex:1;font-size:13px;line-height:1.45;}
.task-row[data-checked="1"] .task-label{color:var(--muted);text-decoration:line-through;}
.type-badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;
  color:#fff;flex-shrink:0;margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.tb-fire{background:var(--t-fire);}
.tb-prep{background:var(--t-prep);color:#3a2800;}
.tb-gather{background:var(--t-gather);}
.tb-plate{background:var(--t-plate);}
.tb-purchase{background:var(--t-purchase);}
.tb-par{background:var(--t-par);color:#3a2800;}
.tb-tomorrow{background:var(--t-tomorrow);}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600;background:var(--surf);
  border:none;position:relative;cursor:pointer;transition:background .15s;}
.cal-day.today{background:var(--acc);color:#fff;border-color:var(--acc);}
.cal-day.past{color:var(--muted);}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;
  border-radius:50%;background:var(--acc2);}
.cal-day.today.has-event::after{background:#fff;}
.event-list{margin-top:8px;}
.event-item{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;}
.event-dot{width:8px;height:8px;border-radius:50%;background:var(--acc2);flex-shrink:0;}
.event-d{font-weight:700;min-width:26px;color:var(--acc);}

/* ── PAR CHECKS ── */
.par-item{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;}
.par-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.par-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);}
.par-check[data-checked="1"]::after{content:'✓';color:#fff;font-size:11px;font-weight:800;}
.par-day{font-size:11px;color:var(--muted);margin-left:auto;flex-shrink:0;
  background:var(--bg);padding:2px 8px;border-radius:10px;}

/* ── CARRY ── */
.carry-section{background:var(--surf);border:none;
  border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-bubble);}
.carry-title{background:var(--surf);
  font-size:12px;font-weight:800;color:var(--acc);text-transform:uppercase;
  letter-spacing:.6px;padding:12px 16px 6px;}
.carry-item{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;}
.carry-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;}
.carry-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);
  box-shadow:0 0 8px rgba(239,148,167,.5);}
.carry-check[data-checked="1"]::after{content:'✦';color:#fff;font-size:11px;}
.carry-check:active{transform:scale(0.88);}

/* ── BRIDGE ── */
.bridge-row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.bridge-row label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;}
.bridge-input{background:var(--surf);border:2px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:14px;color:var(--text);width:100%;font-family:inherit;
  transition:border-color .2s;}
.bridge-input:focus{outline:none;border-color:var(--acc);}
.bridge-btn{background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border:none;border-radius:12px;
  padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;
  font-family:inherit;transition:opacity .2s;}
.bridge-btn:active{opacity:.75;}
.bridge-status{background:var(--surf);border:2px solid var(--border);border-radius:10px;
  padding:12px;font-size:12px;color:var(--muted);font-family:monospace;margin-top:8px;
  min-height:60px;white-space:pre-wrap;word-break:break-all;}

/* ── HOME ── */
.home-stat{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;font-size:13px;}
.home-stat-val{font-weight:700;color:var(--acc);}
.home-event-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 0;}
.home-event-badge{background:var(--acc2);color:#fff;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:10px;flex-shrink:0;}

/* ── COMING SOON PANELS ── */
.coming-soon{display:flex;flex-direction:column;align-items:center;
  gap:12px;padding:32px 16px;text-align:center;}
.cs-emoji{font-size:48px;}
.coming-soon h2{font-size:19px;font-weight:800;color:var(--acc);}
.coming-soon p{font-size:13px;color:var(--muted);line-height:1.65;max-width:280px;}
.cs-tabs{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:4px;}
.cs-tab{background:var(--surf);border:1.5px solid var(--border);border-radius:12px;
  padding:10px 14px;font-size:12px;text-align:left;color:var(--muted);}
.cs-tab strong{display:block;color:var(--text);font-size:12.5px;margin-bottom:1px;}

/* ── JUNIMO FEED ── */
.room-card{background:var(--surf);border:none;border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-bubble);}
.room-header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--surf);
  cursor:pointer;border-bottom:none;}
.room-card[data-open=true] .room-header{border-bottom:none;}
.room-title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;}
.room-progress{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.room-complete-badge{background:var(--t-gather);color:#fff;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:20px;}
.room-body{padding:4px 8px 8px;}
.room-card[data-open=false] .room-body{display:none;}
.bundle-row{display:flex;flex-direction:column;gap:4px;padding:7px 6px;
  border-radius:10px;margin-top:4px;}
.bundle-row.done{opacity:.55;}
.bundle-top{display:flex;align-items:center;gap:8px;}
.bundle-name{font-size:12.5px;font-weight:700;flex:1;}
.bundle-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--acc);
  background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;}
.bundle-check.done{background:var(--t-gather);border-color:var(--t-gather);color:#fff;}
.bundle-chips{display:flex;flex-wrap:wrap;gap:4px;padding-left:26px;}
.chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;
  border:none;}
.chip.have{background:#8ed4a8;color:#fff;}
.chip.missing{background:var(--bg);color:var(--muted);}
html[data-dark=true] .chip.have{background:#1a3d2a;border-color:#2a6040;color:#6fe0a0;}
html[data-dark=true] .chip.missing{background:var(--bg);color:var(--muted);}
.junimo-offline{padding:24px;text-align:center;color:var(--muted);font-size:13px;}

/* ── QUESTS / UNLOCKS ── */
.unlock-section{background:var(--surf);border:none;border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-bubble);}
.unlock-sec-title{background:var(--surf);font-family:'Press Start 2P',monospace;font-size:7px;font-weight:400;color:var(--acc);letter-spacing:.4px;padding:12px 16px 6px;border-bottom:none;line-height:1.9;}
.unlock-row{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;}
.unlock-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);background:var(--bg);flex-shrink:0;}
.unlock-dot.yes{background:var(--acc);border-color:var(--acc);}
.unlock-level{font-size:10px;background:var(--bg);color:var(--acc);padding:2px 7px;border-radius:10px;margin-left:auto;font-weight:700;flex-shrink:0;}
.quest-row{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;}
.quest-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0;white-space:nowrap;}
.qs-active{background:#5898e018;color:#4480c8;border:1px solid #5898e040;}
.qs-done{background:#58c08018;color:#1a6636;border:1px solid #58c08040;}
.quest-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--acc);background:var(--bg);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .15s;}
.quest-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);color:#fff;}

/* ── MUSEUM ── */
.museum-header{text-align:center;padding:16px 14px 8px;}
.museum-count{font-size:32px;font-weight:800;color:var(--acc);}
.museum-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.museum-bar-track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin:0 14px 12px;}
.museum-bar-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px;transition:width .5s;}
.museum-ms{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;}
.museum-ms-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
.museum-ms-dot.reached{background:var(--acc);}

/* ── COVENANT ── */
.npc-card{background:var(--surf);border:none;border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-bubble);}
.npc-header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surf);cursor:pointer;border-bottom:none;}
.npc-card[data-open=true] .npc-header{border-bottom:none;}
.npc-card[data-open=false] .npc-body{display:none;}
.npc-portrait{width:44px;height:44px;flex-shrink:0;image-rendering:pixelated;border-radius:8px;object-fit:cover;}
.npc-name{font-weight:800;font-size:13px;flex:1;}
.npc-bday-tag{font-size:10px;color:var(--muted);flex-shrink:0;text-align:right;}
.npc-hearts-mini{display:flex;gap:1px;flex-shrink:0;}
.heart-sm{font-size:9px;line-height:1;}
.npc-body{padding:10px 14px;}
.npc-hearts-row{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-bottom:8px;}
.heart-lg{font-size:16px;line-height:1;}
.npc-pts{font-size:11px;color:var(--muted);margin-left:6px;}
.npc-gift-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.npc-gifts{display:flex;flex-wrap:wrap;gap:4px;}
.gift-chip{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);}

/* ── TIMELINE / LORE ── */
.timeline-row{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12.5px;}
.timeline-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);background:var(--bg);flex-shrink:0;}
.timeline-dot.yes{background:var(--t-gather);border-color:var(--t-gather);}
.timeline-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;flex-shrink:0;background:var(--bg);color:var(--muted);border:none;}
.timeline-badge.auto{background:#5898e018;color:#4480c8;border-color:#5898e040;}

/* ── GRANDPA MILESTONES ── */
.y1-target{background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));border:none;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;}
.y1-target-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.y1-target-val{font-size:20px;font-weight:800;color:var(--acc);}
.y1-target-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.gpa-summary{background:var(--surf);border:none;border-radius:var(--r);padding:16px;margin-bottom:12px;text-align:center;}
.gpa-candles{font-size:28px;letter-spacing:4px;margin-bottom:4px;}
.gpa-score{font-size:18px;font-weight:800;color:var(--acc);}
.gpa-label{font-size:11px;color:var(--muted);margin-top:2px;}
.milestone-row{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12.5px;}
.milestone-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);background:var(--bg);flex-shrink:0;}
.milestone-dot.yes{background:var(--t-gather);border-color:var(--t-gather);}
.milestone-bar{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;}
.milestone-bar-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s;}
.gpa-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--acc);background:var(--bg);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transition:all .15s;margin-left:auto;}
.gpa-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);color:#fff;}

/* ── NIGHTLOCK ── */
.inv-grid{display:flex;flex-direction:column;gap:0;}
.inv-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px;}
.inv-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inv-meta{font-size:11px;color:var(--muted);flex-shrink:0;}
.inv-qual{font-size:12px;flex-shrink:0;}
.davy-gold{font-size:26px;font-weight:800;color:var(--acc);}
.equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;}
.equip-slot{background:var(--bg);border:none;border-radius:10px;padding:8px 10px;}
.equip-slot-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.equip-slot-val{font-size:12px;color:var(--text);font-weight:600;}
.equip-slot-val.empty{color:var(--muted);font-style:italic;font-weight:400;}
.skill-card{background:var(--surf);border:none;border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-bubble);}
.skill-card-hdr{background:var(--surf);padding:12px 16px;display:flex;align-items:center;gap:8px;}
.skill-icon{width:26px;height:26px;flex-shrink:0;image-rendering:pixelated;display:block;}
.skill-icon.emoji{width:auto;height:auto;font-size:18px;}
.skill-name{font-weight:800;font-size:13px;flex:1;}
.skill-level{font-size:13px;font-weight:800;color:var(--acc);}
.skill-card-body{padding:10px 14px;}
.xp-bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:4px 0 6px;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px;transition:width .5s;}
.xp-label{font-size:10px;color:var(--muted);margin-bottom:6px;}
.prof-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.prof-tag{font-size:10px;padding:3px 9px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);}
.prof-tag.chosen{background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));border-color:var(--acc);font-weight:700;}
.grass-row{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;}
.grass-name{font-weight:700;flex:1;}
.grass-hearts{display:flex;gap:1px;}
.grass-pts{font-size:10px;color:var(--muted);min-width:45px;text-align:right;}
.recipe-section-title{font-family:'Press Start 2P',monospace;font-size:7px;font-weight:400;color:var(--muted);letter-spacing:.4px;padding:8px 14px;background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));border-bottom:none;line-height:1.9;}
.recipe-grid{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;}
.recipe-chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);}
.animal-row{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px;}
.animal-name{font-weight:700;flex:1;}
.animal-type{font-size:11px;color:var(--muted);}
.animal-hearts{display:flex;gap:1px;}
.flag-count{font-size:11px;color:var(--acc);font-weight:700;margin-left:auto;}
.stat-val{font-size:11px;font-weight:700;color:var(--acc);margin-left:auto;}

/* ── BACKGROUND FLOATING SPRITES ── */
#bg-sprites{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-sprite{position:absolute;image-rendering:pixelated;opacity:.07;
  animation:bgfloat var(--dur,18s) ease-in-out infinite alternate;
  will-change:transform;}
@keyframes bgfloat{
  from{transform:translateY(0) rotate(var(--rot,0deg));}
  to{transform:translateY(var(--dy,-24px)) rotate(var(--rot2,4deg));}}
html[data-dark=true] .bg-sprite{opacity:.05;}

/* ── JUNIMOS & PARTICLES ── */
.junimo{position:fixed;pointer-events:none;z-index:1000;width:32px;height:32px;
  animation:jh .6s ease-in-out infinite alternate;}
@keyframes jh{from{transform:translateY(0);}to{transform:translateY(-6px);}}
.particle{position:fixed;pointer-events:none;z-index:999;width:7px;height:7px;
  border-radius:50%;animation:pf .8s ease-out forwards;}
@keyframes pf{
  from{transform:translate(0,0) scale(1);opacity:1;}
  to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}}
</style>
</head>
<body>
<div id="bg-sprites"></div>
<div id="schema-banner">⚠️ Bridge data format changed — please restart stardew-bridge.py</div>

  <img class="bg-sprite" src="assets/icons/emoji-mushroom.png" style="left:60%;top:12%;width:48px;--dur:21s;--dy:-18px;--rot:6deg;--rot2:-2deg;">

  <img class="bg-sprite" src="assets/icons/galaxy-sword.png" style="left:83%;top:22%;width:50px;--dur:23s;--dy:-22px;--rot:10deg;--rot2:-5deg;">
  <img class="bg-sprite" src="assets/icons/emoji-heart.png" style="left:90%;top:68%;width:40px;--dur:14s;--dy:-16px;--rot:-3deg;--rot2:6deg;">
  <img class="bg-sprite" src="assets/icons/item-pumpkin.png" style="left:8%;top:80%;width:56px;--dur:20s;--dy:-30px;--rot:5deg;--rot2:-8deg;">

  <img class="bg-sprite" src="assets/icons/item-gold-bar.png" style="left:35%;top:88%;width:56px;--dur:18s;--dy:-22px;--rot:4deg;--rot2:-4deg;">
  <img class="bg-sprite" src="assets/icons/keg.png" style="left:78%;top:82%;width:56px;--dur:24s;--dy:-28px;--rot:-2deg;--rot2:7deg;">
</div>

<div id="ticker">

    <span id="ticker-subtitle">or Dew Not</span>
  </div>

    <button id="dark-btn" aria-label="Toggle dark mode">🌙</button>
  </div>
</div>

<main id="main">

  <!-- 🏠 HOME -->
  <div class="panel active" id="p-home">
    <div class="home-hero">
      <img class="home-logo" src="assets/logo.png" alt="Stardew Valley">
      <div class="home-subtitle">or Dew Not</div>

    <div class="card">
      <div class="card-header"><img src="assets/icons/emoji-star.png" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;margin-right:6px"> Today</div>
      <div class="card-body">
        <div class="home-stat"><span>Season &amp; Day</span><span class="home-stat-val" id="home-day">Spring 1 · Year 1</span></div>
        <div class="home-stat"><span>Tasks Today</span><span class="home-stat-val" id="home-tasks">—</span></div>
        <div class="home-stat"><span>Bridge</span><span class="home-stat-val" id="home-bridge">Not connected</span></div>
      </div>

      <div class="card-body" id="home-events"></div>
    </div>

  <!-- ✨ STORY TIME -->
  <div class="panel" id="p-story">

    <div class="sub-panel active" id="stp-previously"><div id="previously-content"></div></div>

    <div class="sub-panel" id="stp-odds"><div id="odds-content"></div></div>

  <!-- 💜 BIG DADDY NIGHTLOCK -->
  <div class="panel" id="p-nightlock">

// Sprite icon helper — inline img for section headers
function si(name,size=16){return `<img src="assets/icons/${name}.png" style="width:${size}px;height:${size}px;image-rendering:pixelated;vertical-align:middle;margin-right:5px;flex-shrink:0" onerror="this.style.display='none'">`;}

const lsGet=k=>localStorage.getItem(k);
const lsSet=(k,v)=>localStorage.setItem(k,v);
const lsTgl=k=>{const v=lsGet(k)==='1';lsSet(k,v?'0':'1');return !v;};

// Namespaced storage for new tools — key: sdv:<saveHash>:<name>
function saveHash(){return S.bridge?(S.bridge.farm||'hoedown').replace(/\s+/g,'').toLowerCase():'hoedown';}
const nsKey=(k)=>`sdv:${saveHash()}:${k}`;
const nsGet=k=>localStorage.getItem(nsKey(k));
const nsSet=(k,v)=>localStorage.setItem(nsKey(k),v);
const nsTgl=k=>{const v=nsGet(k)==='1';nsSet(k,v?'0':'1');return !v;};

function seasonLabel(){
  return {spring:'🌱 Spring',summer:'☀️ Summer',fall:'🍂 Fall',winter:'❄️ Winter'}[S.season];
}

function renderTicker(){
  document.getElementById('ticker-text').textContent=`${seasonLabel()} ${S.day} · Year 1`;
  document.documentElement.dataset.season=S.season;
}

function renderHome(){
  const sn={spring:'Spring',summer:'Summer',fall:'Fall',winter:'Winter'};
  document.getElementById('home-day').textContent=`${sn[S.season]} ${S.day} · Year 1`;

  const todayData=(RD[S.season]||[]).find(d=>d.d===S.day);
  if(todayData){
    const total=todayData.tasks.length;
    const done=todayData.tasks.filter(t=>lsGet('sdv_t_'+t.id)==='1').length;
    document.getElementById('home-tasks').textContent=`${done}/${total} done`;
  } else {
    document.getElementById('home-tasks').textContent='—';
  }

  document.getElementById('home-bridge').textContent=S.bridge?'Connected ✓':'Not connected';

  const evts=(EVENTS[S.season]||[]).filter(e=>e.d>=S.day);
  const upcoming=evts.slice(0,5);
  const el=document.getElementById('home-events');
  if(upcoming.length){
    el.innerHTML=upcoming.map(e=>`
      <div class="home-event-row">
        <span class="home-event-badge">Day ${e.d}</span>
        <span>${e.name}</span>
      </div>`).join('');
  } else {
    el.innerHTML='<div style="color:var(--muted);font-size:13px">No more events this season</div>';
  }
}

function renderRoute(){
  const list=document.getElementById('route-list');
  const days=RD[S.season];
  const frag=document.createDocumentFragment();
  days.forEach(day=>{
    const isToday=day.d===S.day;
    const card=document.createElement('div');
    card.className='route-day'+(isToday?' today':'');
    card.dataset.open=isToday?'true':'false';
    card.dataset.d=day.d;
    const evts=(EVENTS[S.season]||[]).filter(e=>e.d===day.d);
    const evtHtml=evts.map(e=>`<span class="day-event">${e.name}</span>`).join('');
    card.innerHTML=`<div class="day-header">
      <span class="day-num">${day.d}</span>
      <span class="day-name">${day.name}</span>
      ${evtHtml}
      <span class="day-arrow">▶</span>
    </div>
    <div class="day-body">${day.tasks.map(t=>{
      const ch=lsGet('sdv_t_'+t.id)==='1'?'1':'0';
      return `<div class="task-row" data-checked="${ch}">
        <div class="task-check" data-id="${t.id}" data-checked="${ch}"></div>
        <span class="type-badge tb-${t.type}">${t.type}</span>
        <span class="task-label">${t.label}</span>
      </div>`;
    }).join('')}</div>`;
    frag.appendChild(card);
  });
  list.innerHTML='';
  list.appendChild(frag);
  const todayEl=list.querySelector('.route-day.today');
  if(todayEl) setTimeout(()=>todayEl.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

function renderCal(){
  const evts=EVENTS[S.season]||[];
  const evtDays=new Set(evts.map(e=>e.d));
  let html='<div class="cal-grid">';
  for(let d=1;d<=28;d++){
    const cls=['cal-day',d===S.day?'today':'',d<S.day?'past':'',evtDays.has(d)?'has-event':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" data-cal-d="${d}">${d}</div>`;
  }
  html+='</div><div class="event-list">';
  evts.forEach(e=>{html+=`<div class="event-item"><div class="event-dot"></div><span class="event-d">${e.d}</span><span>${e.name}</span></div>`;});
  html+='</div>';
  document.getElementById('cal-content').innerHTML=html;
}

function renderPar(){
  const html=PAR.map(p=>{
    const ch=lsGet('sdv_par_'+p.id)==='1'?'1':'0';
    const iconHtml=p.icon?`<img src="assets/icons/${p.icon}.png" style="width:20px;height:20px;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`:'';
    return `<div class="par-item">
      <div class="par-check" data-par-id="${p.id}" data-checked="${ch}"></div>
      ${iconHtml}
      <span>${p.label}</span>
      <span class="par-day">${p.target}</span>
    </div>`;
  }).join('');
  document.getElementById('par-content').innerHTML=html;
}

const SORD={spring:0,summer:1,fall:2,winter:3};
function daysUntil(bs,bd){
  const ci=SORD[S.season]||0,bi=SORD[bs]||0;
  let d=(bi-ci)*28+(bd-S.day);
  if(d<=0) d+=112;
  return d;
}

function renderJunimo(){
  const el=document.getElementById('junimo-content');
  if(!el) return;
  const data=S.bridge;
  if(!data||!data.cc_bundles){
    el.innerHTML='<div class="junimo-offline">Connect the bridge to sync Community Center progress — or load will happen automatically when bridge is online ✨</div>';
    return;
  }
  const frag=document.createDocumentFragment();
  data.cc_bundles.forEach(room=>{
    const allDone=room.done===room.bundles.length;
    const card=document.createElement('div');
    card.className='room-card';
    card.dataset.open='true';
    const hdr=document.createElement('div'); hdr.className='room-header';
    const badge=allDone?`<span class="room-complete-badge">✓ DONE</span>`:
      `<span style="font-size:11px;color:var(--muted)">${room.done}/${room.bundles.length}</span>`;
    hdr.innerHTML=`<span class="room-title">${ROOM_ICON_JS[room.name]||'📦'} ${room.name}</span>
      <div class="room-progress">${badge}</div>`;
    const body=document.createElement('div'); body.className='room-body';
    room.bundles.forEach(bundle=>{
      const haveCount=bundle.slots.filter(s=>s.have).length;
      const brow=document.createElement('div');
      brow.className='bundle-row'+(bundle.completed?' done':'');
      const checkIcon=bundle.completed?'✓':'';
      brow.innerHTML=`<div class="bundle-top">
        <div class="bundle-check${bundle.completed?' done':''}">${checkIcon}</div>
        <span class="bundle-name">${bundle.name}</span>
        ${!bundle.completed?`<span style="font-size:10px;color:var(--muted)">${haveCount}/${bundle.slots.length}</span>`:''}
      </div>`;
      if(bundle.slots.length){
        const chips=document.createElement('div'); chips.className='bundle-chips';
        bundle.slots.forEach(slot=>{
          const c=document.createElement('span');
          c.className='chip '+(slot.have?'have':'missing');
          c.textContent=(slot.have?'✓ ':'')+slot.name;
          chips.appendChild(c);
        });
        brow.appendChild(chips);
      }
      body.appendChild(brow);
    });
    card.appendChild(hdr); card.appendChild(body);
    frag.appendChild(card);
  });
  el.innerHTML='';
  el.appendChild(frag);
}

function goHoardSub(sub){

function checkStoryFlag(f,b){
  if(f.auto) return f.auto();
  if(!b) return false;
  if(f.ev) return (b.events||[]).includes(f.ev);
  if(f.mail) return (b.mail||[]).includes(f.mail);
  if(f.day){const so={spring:0,summer:1,fall:2,winter:3};return so[S.season]*28+S.day>so[f.day.s]*28+f.day.d;}
  if(f.ccRoom){const r=(b.cc_bundles||[]).find(x=>x.name===f.ccRoom);return r?r.done===r.bundles.length:false;}
  if(f.ccAll) return (b.cc_bundles||[]).length>0&&b.cc_bundles.every(r=>r.done===r.bundles.length);
  if(f.houseMin) return (b.houseUpgradeLevel||0)>=f.houseMin;
  if(f.spouse) return !!(b.spouse);
  if(f.musMin) return (b.museumDonations||0)>=f.musMin;
  return false;
}

const GROUP_ICONS={'Spring':'crop-parsnip','Summer':'crop-melon','Fall':'crop-pumpkin','Winter':'emoji-snowflake','Community Center':'emoji-sparkle','Unlocked Areas':'buff-mining','Magic & Lore':'emoji-star','Farm Life':'chest-wood','Museum Milestones':'icon-chest'};
function renderGroupedFlags(items,checkFn,b){
  const groups={};
  items.forEach(f=>{if(!groups[f.g])groups[f.g]=[];groups[f.g].push(f);});
  return Object.entries(groups).map(([g,flags])=>{
    const doneCount=flags.filter(f=>checkFn(f,b)).length;
    const gClean=g.replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}✨🗺️🏛️🏠❄️🍂☀️🌱]+\s*/u,'');
    const icon=GROUP_ICONS[gClean]||flags[0]?.gi||'';
    const rows=flags.map(f=>{
      const done=checkFn(f,b);
      const badge=b?`<span class="timeline-badge${done?' auto':''}">${done?'✓':'AUTO'}</span>`:'';
      return `<div class="timeline-row"><div class="timeline-dot${done?' yes':''}"></div><span style="flex:1">${f.label}</span>${badge}</div>`;
    }).join('');
    return `<div class="unlock-section"><div class="unlock-sec-title">${icon?si(icon,18):''}${gClean}<span style="margin-left:auto;color:var(--acc);font-size:10px">${doneCount}/${flags.length}</span></div>${rows}</div>`;
  }).join('');
}

function grandpaScore(b){
  if(!b) return 0;
  return GRANDPA.reduce((sum,g)=>{
    let done=false;
    if(g.c) done=!!g.c(b);
    else if(g.p) done=g.p(b)>=g.m;
    else if(g.manual) done=nsGet(g.mk)==='1';
    return sum+(done?1:0);
  },0);
}

function checkMQ(f){
  if(f.auto) return f.auto();
  if(f.mk) return nsGet(f.mk)==='1';
  const b=S.bridge;
  if(!b) return false;
  if(f.ev) return (b.events||[]).includes(f.ev);
  if(f.c) return f.c(b);
  if(f.houseMin) return (b.houseUpgradeLevel||0)>=f.houseMin;
  if(f.ccRoom){const r=(b.cc_bundles||[]).find(x=>x.name===f.ccRoom);return r?r.done===r.bundles.length:false;}
  if(f.ccAll) return (b.cc_bundles||[]).length>0&&b.cc_bundles.every(r=>r.done===r.bundles.length);
  return false;
}

function heartBar(pts,max){
  const full=Math.floor(pts/250);
  const half=pts%250>=125?1:0;
  const empty=Math.max(0,max-full-half);
  const hF=`<img src="assets/icons/emoji-heart.png" style="width:13px;height:13px;image-rendering:pixelated;vertical-align:middle">`;
  const hH=`<img src="assets/icons/emoji-love.png" style="width:13px;height:13px;image-rendering:pixelated;vertical-align:middle">`;
  const hE=`<img src="assets/icons/emoji-heart.png" style="width:13px;height:13px;image-rendering:pixelated;vertical-align:middle;opacity:.2;filter:grayscale(1)">`;
  return hF.repeat(Math.max(0,full))+(half?hH:'')+hE.repeat(empty);
}

function renderSkillmaxxing(){
  const el=document.getElementById('skills-content');
  if(!el) return;
  const b=S.bridge;
  const profs=new Set(b?(b.professions||[]):[]);
  let html='';
  ['farm','fish','forage','mine','combat'].forEach(id=>{
    const meta=SKILL_META[id];
    const level=b?(b.skills||{})[id]||0:0;
    const xp=b?(b.skillsXP||{})[id]||0:0;
    const isMax=level>=10;
    const xpCur=isMax?XP_THRESH[10]:xp-XP_THRESH[level];
    const xpNxt=isMax?XP_THRESH[10]:XP_THRESH[level+1]-XP_THRESH[level];
    const pct=isMax?100:Math.round(xpCur/xpNxt*100);
    const myProfs=SKILL_PROFS[id].filter(p=>profs.has(p));
    html+=`<div class="skill-card">
      <div class="skill-card-hdr">
        ${meta.e}
        <span class="skill-name">${meta.n}</span>
        <span class="skill-level">Lv ${level}${isMax?' ★':''}</span>
      </div>
      <div class="skill-card-body">
        ${!b?'<div style="font-size:12px;color:var(--muted)">Connect bridge for XP data</div>':`
        <div class="xp-label">${isMax?'MAX — '+xp.toLocaleString()+' total XP':`${xpCur.toLocaleString()} / ${xpNxt.toLocaleString()} XP to Lv ${level+1}`}</div>
        <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div>
        `}
        ${myProfs.length?`<div class="prof-tags">${myProfs.map(p=>`<div class="prof-tag chosen" title="${PROF_DATA[p].d}">${PROF_DATA[p].n}</div>`).join('')}</div>`
        :(level>=5&&b?'<div style="font-size:11px;color:var(--muted);margin-top:4px">No profession chosen yet (need Lv 5)</div>':'')}
      </div>
    </div>`;
  });
  el.innerHTML=html||'<div class="junimo-offline">Connect bridge for skill data 📈</div>';
}

function renderTouchingGrass(){
  const el=document.getElementById('grass-content');
  if(!el) return;
  const friendship=S.bridge?(S.bridge.friendship||{}):{};
  const sorted=[...NPC_DATA].sort((a,b)=>(friendship[b.k]||0)-(friendship[a.k]||0));
  let html=`<div class="unlock-section"><div class="unlock-sec-title">${si('buff-foraging',18)}Friendship — sorted by hearts</div>`;
  sorted.forEach(npc=>{
    const pts=friendship[npc.k]||0;
    const hearts=Math.min(8,Math.floor(pts/250));
    const halfH=pts%250>=125;
    const hFull=`<img src="assets/icons/emoji-heart.png" style="width:13px;height:13px;image-rendering:pixelated;vertical-align:middle">`;
    const hHalf=`<img src="assets/icons/emoji-love.png" style="width:13px;height:13px;image-rendering:pixelated;vertical-align:middle">`;
    const hEmpty=`<img src="assets/icons/emoji-x.png" style="width:13px;height:13px;image-rendering:pixelated;vertical-align:middle;opacity:.3">`;
    const filledH=hFull.repeat(hearts)+(halfH&&hearts<8?hHalf:'');
    const emptyH=hEmpty.repeat(8-hearts-(halfH&&hearts<8?1:0));
    html+=`<div class="grass-row">
      <img src="assets/portraits/${npc.k}.png" alt="${npc.n}" style="width:28px;height:28px;image-rendering:pixelated;border-radius:6px;flex-shrink:0" onerror="this.outerHTML='<span style=font-size:14px>${npc.e}</span>'">
      <span class="grass-name">${npc.n}</span>
      <span class="grass-hearts">${filledH}${emptyH}</span>
      <span class="grass-pts">${pts.toLocaleString()}/${(8*250).toLocaleString()}</span>
    </div>`;
  });
  html+='</div>';
  if(!S.bridge) html='<div class="junimo-offline">Connect bridge for live friendship data 🌿</div>'+html;
  el.innerHTML=html;
}

function renderHolocron(){
  const el=document.getElementById('holocron-content');
  if(!el) return;
  const b=S.bridge;
  const stats=b?b.stats||{}:{};
  const fishCount=stats.fishCaught||0;
  const donations=b?b.museumDonations||0:0;

  function pbar(done,total,color){
    const pct=total>0?Math.min(100,Math.round(done/total*100)):0;
    return `<div style="background:rgba(0,0,0,.08);border-radius:8px;height:8px;overflow:hidden;margin:4px 0 8px">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:8px;transition:width .4s"></div></div>
      <div style="font-size:11px;color:var(--muted);text-align:right;margin-top:-6px;margin-bottom:8px">${done} / ${total}</div>`;
  }

  // Fish tab uses bridge count; individual species are manual checkboxes
  let html='';

  // ── Fish ─────────────────────────────────────────────────────────────────────
  const fishChecked=FISH_LIST.filter(f=>nsGet('holo_fish_'+f.id)==='1').length;
  html+=`<div class="unlock-section">
    <div class="unlock-sec-title"><img src="assets/icons/emoji-fish.png" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;margin-right:4px"> Fish Caught</div>
    ${pbar(fishCount,b?Math.max(fishCount,80):80,'#5bb8e8')}
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Species logged manually · ${fishChecked}/${FISH_LIST.length} species</div>`;
  // Group by season
  const seasons=['spring','summer','fall','winter','all'];
  const seasonLabel2={spring:'🌱 Spring',summer:'☀️ Summer',fall:'🍂 Fall',winter:'❄️ Winter',all:'🗓 Year-Round'};
  seasons.forEach(s=>{
    const group=FISH_LIST.filter(f=>f.season===s);
    if(!group.length) return;
    html+=`<div style="font-size:11px;font-weight:600;color:var(--acc);margin:8px 0 4px">${seasonLabel2[s]}</div>`;
    group.forEach(f=>{
      const ch=nsGet('holo_fish_'+f.id)==='1';
      html+=`<div class="unlock-row" style="cursor:pointer" onclick="const v=nsTgl('holo_fish_${f.id}');this.querySelector('.unlock-dot').classList.toggle('yes',v);renderHolocron()">
        <div class="unlock-dot${ch?' yes':''}"></div>
        <span style="flex:1">${f.n}</span>
        <span style="font-size:10px;color:var(--muted)">${f.src}</span>
      </div>`;
    });
  });
  html+='</div>';

  // ── Artifacts ────────────────────────────────────────────────────────────────
  const artChecked=ARTIFACT_LIST.filter((_,i)=>nsGet('holo_art_'+i)==='1').length;
  html+=`<div class="unlock-section">
    <div class="unlock-sec-title"><img src="assets/icons/emoji-sparkle.png" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;margin-right:4px"> Artifacts (${artChecked}/${ARTIFACT_LIST.length})</div>
    ${pbar(artChecked,ARTIFACT_LIST.length,'#e8b55b')}`;
  ARTIFACT_LIST.forEach((name,i)=>{
    const ch=nsGet('holo_art_'+i)==='1';
    html+=`<div class="unlock-row" style="cursor:pointer" onclick="const v=nsTgl('holo_art_${i}');this.querySelector('.unlock-dot').classList.toggle('yes',v)">
      <div class="unlock-dot${ch?' yes':''}"></div>
      <span>${name}</span>
    </div>`;
  });
  html+='</div>';

  // ── Minerals ────────────────────────────────────────────────────────────────
  const minChecked=MINERAL_LIST.filter((_,i)=>nsGet('holo_min_'+i)==='1').length;
  html+=`<div class="unlock-section">
    <div class="unlock-sec-title"><img src="assets/icons/item-amethyst.png" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;margin-right:4px" onerror="this.outerHTML='💎'"> Minerals (${minChecked}/${MINERAL_LIST.length})</div>
    ${pbar(minChecked,MINERAL_LIST.length,'#c47bdb')}`;
  MINERAL_LIST.forEach((name,i)=>{
    const ch=nsGet('holo_min_'+i)==='1';
    html+=`<div class="unlock-row" style="cursor:pointer" onclick="const v=nsTgl('holo_min_${i}');this.querySelector('.unlock-dot').classList.toggle('yes',v)">
      <div class="unlock-dot${ch?' yes':''}"></div>
      <span>${name}</span>
    </div>`;
  });
  html+='</div>';

  // ── Cooking ─────────────────────────────────────────────────────────────────
  const cooking=b?b.cookingRecipes||[]:[];
  html+=`<div class="unlock-section">
    <div class="unlock-sec-title"><img src="assets/icons/keg.png" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;margin-right:4px"> Cooking (${cooking.length} / 80 recipes)</div>
    ${pbar(cooking.length,80,'#e86fad')}`;
  if(cooking.length){
    cooking.forEach(name=>{
      html+=`<div class="unlock-row"><div class="unlock-dot yes"></div><span>${name}</span></div>`;
    });
  } else {
    html+='<div style="font-size:12px;color:var(--muted);padding:8px 0">Connect bridge to see your recipe book 📺</div>';
  }
  html+='</div>';

  // ── Museum ──────────────────────────────────────────────────────────────────
  html+=`<div class="unlock-section">
    <div class="unlock-sec-title"><img src="assets/icons/emoji-sparkle.png" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;margin-right:4px"> Museum Donations (${donations} / 95)</div>
    ${pbar(donations,95,'#7ba8e8')}
  </div>`;

  if(!b) html='<div class="junimo-offline">Connect bridge for live fish count, cooking recipes &amp; museum data 🔮</div>'+html;
  el.innerHTML=html;
}

function goNightlockSub(sub){
  document.querySelectorAll('#nightlock-sub-nav .sub-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#p-nightlock .sub-panel').forEach(p=>p.classList.remove('active'));
  const btn=document.querySelector(`#nightlock-sub-nav .sub-btn[data-nsub="${sub}"]`);
  const panel=document.getElementById('nlp-'+sub);
  if(btn) btn.classList.add('active');
  if(panel) panel.classList.add('active');
  lsSet('sdv_nsub',sub);
  document.documentElement.dataset.sub=sub;
  renderNightlockSub(sub);
}

  else if(sub==='lore') renderLore();
  else if(sub==='covenant') renderStoryCovenant();
  else if(sub==='milestones') renderMilestones();
  else if(sub==='mainquest') renderMainQuest();
  else if(sub==='odds') renderOdds();
}

function goStoryTab(sub){
  document.querySelectorAll('#story-sub-nav .sub-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#p-story .sub-panel').forEach(p=>p.classList.remove('active'));
  const btn=document.querySelector(`#story-sub-nav .sub-btn[data-stab="${sub}"]`);
  const panel=document.getElementById('stp-'+sub);
  if(btn) btn.classList.add('active');
  if(panel) panel.classList.add('active');
  lsSet('sdv_stab',sub);
  document.documentElement.dataset.sub=sub;
  renderStoryTab(sub);
}

function renderFromData(data){
  if(!data) return;
  const sea=(data.season||'').toLowerCase();
  if(['spring','summer','fall','winter'].includes(sea)) S.season=sea;
  const d=parseInt(data.day);
  if(d>=1&&d<=28) S.day=d;
  document.documentElement.dataset.season=S.season;
  renderTicker(); renderRoute(); renderCal(); renderHome();
  // Re-render live tools if their panel is visible
  if(S.tab==='hoard') renderHoardSub(lsGet('sdv_hsub')||'junimo');
  if(S.tab==='story') renderStoryTab(lsGet('sdv_stab')||'previously');
  if(S.tab==='nightlock') renderNightlockSub(lsGet('sdv_nsub')||'tardis');
}

function updateSyncDot(){
  const dot=document.getElementById('bridge-dot');
  const lbl=document.getElementById('bridge-sync-time');
  if(!S.lastSyncMs){dot.className='';if(lbl)lbl.textContent='';return;}
  const age=Date.now()-S.lastSyncMs;
  const mm=String(new Date(S.lastSyncMs).getMinutes()).padStart(2,'0');
  const ss=String(new Date(S.lastSyncMs).getSeconds()).padStart(2,'0');
  const hh=String(new Date(S.lastSyncMs).getHours()).padStart(2,'0');
  if(lbl) lbl.textContent=`${hh}:${mm}:${ss}`;
  if(age<30000)      dot.className='ok';
  else if(age<120000) dot.className='stale';
  else               dot.className='';
}
setInterval(updateSyncDot,5000);

async function fetchBridge(){
  const ip=S.bridgeIP;
  if(!ip) return;
  const status=document.getElementById('bridge-status');
  try{
    const base=ip.startsWith('http')?ip:`https://${ip}`;
    const res=await fetch(`${base}:${BRIDGE_PORT}/save`,{signal:AbortSignal.timeout(8000)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    S.bridge=data; S.lastSyncMs=Date.now(); updateSyncDot();
    // Schema version check
    const banner=document.getElementById('schema-banner');
    if(banner) banner.style.display=(data.schema_version&&data.schema_version!==BRIDGE_SCHEMA_VER)?'block':'none';
    status.textContent=JSON.stringify(data,null,2);
    document.getElementById('home-bridge').textContent='Connected ✓';
    renderFromData(data);
  }catch(e){
    updateSyncDot();
    status.textContent=`Error: ${e.message}`;
    document.getElementById('home-bridge').textContent='Error';
  }
}

// Fetch on visibility/focus — not on an interval (iOS Safari throttles background tabs)
document.addEventListener('visibilitychange',()=>{if(!document.hidden) fetchBridge();});
window.addEventListener('focus',fetchBridge);

function goPanel(tab){
  S.tab=tab;
  lsSet('sdv_tab',tab);
  document.documentElement.dataset.tab=tab;
  document.documentElement.dataset.sub='';
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const panel=document.getElementById('p-'+tab);
  if(panel) panel.classList.add('active');
  const btn=document.querySelector(`.nav-btn[data-tab="${tab}"]`);
  if(btn) btn.classList.add('active');
  if(tab==='hoard') goHoardSub(lsGet('sdv_hsub')||'junimo');
  if(tab==='story') goStoryTab(lsGet('sdv_stab')||'previously');
  if(tab==='nightlock') goNightlockSub(lsGet('sdv_nsub')||'tardis');
}

function goSubPanel(sub){
  S.sub=sub;
  lsSet('sdv_rsub',sub);
  document.querySelectorAll('#route-sub-nav .sub-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#p-route .sub-panel').forEach(p=>p.classList.remove('active'));
  const btn=document.querySelector(`#route-sub-nav .sub-btn[data-sub="${sub}"]`);
  const panel=document.getElementById('sp-'+sub);
  if(btn) btn.classList.add('active');
  if(panel) panel.classList.add('active');
  document.documentElement.dataset.sub=sub;
}

const junimoSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32">
<circle cx="8" cy="9" r="6" fill="#EF94A7"/>
<circle cx="6" cy="8" r="1" fill="#3a1f3a"/>
<circle cx="10" cy="8" r="1" fill="#3a1f3a"/>
<ellipse cx="8" cy="11" rx="2" ry="1" fill="#E07090"/>
<circle cx="4" cy="6" r="2" fill="#EF94A7"/>
<circle cx="12" cy="6" r="2" fill="#EF94A7"/>
</svg>`;

function spawnJunimo(){
  const el=document.createElement('div');
  el.className='junimo'; el.innerHTML=junimoSVG;
  el.style.left=Math.random()*(window.innerWidth-40)+'px';
  el.style.top=Math.random()*(window.innerHeight*0.5)+20+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4000+Math.random()*3000);
}
function startJunimos(){spawnJunimo();setInterval(()=>{if(Math.random()<0.3)spawnJunimo();},9000);}

function spawnParticles(el){
  const r=el.getBoundingClientRect();
  const cols=['#EF94A7','#B29EF0','#AABFB0','#F4C1CB','#CFDFE6','#EFCEAA','#DCBFF2'];
  for(let i=0;i<8;i++){
    const p=document.createElement('div'); p.className='particle';
    const sz=4+Math.random()*6;
    p.style.cssText=`left:${r.x+r.width/2}px;top:${r.y}px;background:${cols[i%cols.length]};width:${sz}px;height:${sz}px;--tx:${(Math.random()-.5)*70}px;--ty:${-(25+Math.random()*50)}px`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),900);
  }
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('.nav-btn[data-tab]');
  if(tab){goPanel(tab.dataset.tab);return;}

  const sub=e.target.closest('.sub-btn[data-sub]');
  if(sub){goSubPanel(sub.dataset.sub);return;}

  const hsub=e.target.closest('.sub-btn[data-hsub]');
  if(hsub){goHoardSub(hsub.dataset.hsub);return;}

  const stab=e.target.closest('.sub-btn[data-stab]');
  if(stab){goStoryTab(stab.dataset.stab);return;}

  const nsub=e.target.closest('.sub-btn[data-nsub]');
  if(nsub){goNightlockSub(nsub.dataset.nsub);return;}

  const gpk=e.target.closest('.gpa-check[data-gpk]');
  if(gpk){
    e.stopPropagation();
    const ch=nsTgl(gpk.dataset.gpk)?'1':'0';
    gpk.dataset.checked=ch; gpk.textContent=ch==='1'?'✓':'';
    if(ch==='1') spawnParticles(gpk);
    renderMilestones();
    return;
  }

  const hdr=e.target.closest('.day-header');
  if(hdr){
    const card=hdr.closest('.route-day');
    card.dataset.open=card.dataset.open==='true'?'false':'true';
    return;
  }

  const rhdr=e.target.closest('.room-header');
  if(rhdr){
    const card=rhdr.closest('.room-card');
    card.dataset.open=card.dataset.open==='true'?'false':'true';
    return;
  }

  const nhdr=e.target.closest('.npc-header');
  if(nhdr){
    const card=nhdr.closest('.npc-card');
    card.dataset.open=card.dataset.open==='true'?'false':'true';
    return;
  }

  const qm=e.target.closest('.quest-check[data-qm]');
  if(qm){
    e.stopPropagation();
    const ch=nsTgl(qm.dataset.qm)?'1':'0';
    qm.dataset.checked=ch; qm.textContent=ch==='1'?'✓':'';
    if(ch==='1') spawnParticles(qm);
    return;
  }

  const tc=e.target.closest('.task-check[data-id]');
  if(tc){
    e.stopPropagation();
    const ch=lsTgl('sdv_t_'+tc.dataset.id)?'1':'0';
    tc.dataset.checked=ch;
    const row=tc.closest('.task-row'); if(row) row.dataset.checked=ch;
    if(ch==='1') spawnParticles(tc);
    renderHome();
    return;
  }

  const pc=e.target.closest('.par-check[data-par-id]');
  if(pc){
    const ch=lsTgl('sdv_par_'+pc.dataset.parId)?'1':'0';
    pc.dataset.checked=ch; if(ch==='1') spawnParticles(pc);
    return;
  }

  const cc=e.target.closest('.carry-check[data-carry-id]');
  if(cc){
    const ch=lsTgl('sdv_c_'+cc.dataset.carryId)?'1':'0';
    cc.dataset.checked=ch; if(ch==='1') spawnParticles(cc);
    return;
  }

  if(e.target.closest('#dark-btn')){
    S.dark=!S.dark; lsSet('sdv_dark',S.dark?'1':'0');
    document.documentElement.dataset.dark=S.dark; return;
  }

  if(e.target.closest('#bridge-connect')){
    const ip=document.getElementById('bridge-ip').value.trim();
    if(!ip) return;
    S.bridgeIP=ip; lsSet('sdv_ip',ip);
    fetchBridge(); return;
  }

  const cd=e.target.closest('.cal-day[data-cal-d]');
  if(cd){
    const d=parseInt(cd.dataset.calD);
    const evts=(EVENTS[S.season]||[]).filter(ev=>ev.d===d);
    if(evts.length) alert(evts.map(ev=>ev.name).join('\n'));
    return;
  }
});

function init(){
  const dark=lsGet('sdv_dark');
  if(dark==='1'){S.dark=true;document.documentElement.dataset.dark='true';}

  const ip=lsGet('sdv_ip');
  if(ip){S.bridgeIP=ip;document.getElementById('bridge-ip').value=ip;fetchBridge();}

  const savedTab=lsGet('sdv_tab')||'home';
  const savedSub=lsGet('sdv_rsub')||'tasks';
  const savedHSub=lsGet('sdv_hsub')||'junimo';
  const savedStab=lsGet('sdv_stab')||'previously';

  renderTicker(); renderRoute(); renderCal(); renderPar(); renderCarry(); renderHome();

  goPanel(savedTab);
  goSubPanel(savedSub);
  const savedNSub=lsGet('sdv_nsub')||'tardis';
  if(savedTab!=='hoard') goHoardSub(savedHSub);
  if(savedTab!=='story') goStoryTab(savedStab);
  if(savedTab!=='nightlock') goNightlockSub(savedNSub);

  startJunimos();
}

document.addEventListener('DOMContentLoaded',init);

    'chest-wood','furnace','bee-house','keg','preserves-jar','crystalarium',
    'sprinkler-iridium','scarecrow','galaxy-sword','lava-katana','sword-tempered',
    'dagger-crystal','club-knight','crop-strawberry','crop-melon','crop-pumpkin',
    'crop-sunflower','crop-starfruit','crop-blueberry','crop-corn','crop-ancient-fruit',
    'crop-parsnip','buff-farming','buff-fishing','buff-foraging','buff-mining',
    'buff-combat','buff-luck','emoji-heart','emoji-sparkle','emoji-star',
    'emoji-tulip','emoji-strawberry','emoji-mushroom','emoji-rainbow',
    'emoji-snowflake','emoji-moon','emoji-fish','boots','ring',
    'watering-can-iridium','pickaxe-iridium','axe-iridium'];
  const el=document.getElementById('bg-sprites');
  if(!el) return;
  const W=window.innerWidth, H=window.innerHeight;
  const count=Math.min(55, Math.floor(W*H/6500));
  for(let i=0;i<count;i++){
    const img=document.createElement('img');
    const name=ICONS[Math.floor(Math.random()*ICONS.length)];
    img.src=`assets/icons/${name}.png`;
    img.className='bg-sprite';
    img.onerror=()=>{img.remove();};
    const sz=Math.floor(22+Math.random()*28);
    const rot=(Math.random()*30-15).toFixed(1);
    const rot2=(rot*-1.5).toFixed(1);
    const dur=(14+Math.random()*16).toFixed(1);
    const dy=(-12-Math.random()*20).toFixed(0);
    img.style.cssText=`width:${sz}px;height:${sz}px;left:${(Math.random()*102-1).toFixed(1)}%;top:${(Math.random()*102-1).toFixed(1)}%;--rot:${rot}deg;--rot2:${rot2}deg;--dur:${dur}s;--dy:${dy}px;`;
    el.appendChild(img);
  }
})();
