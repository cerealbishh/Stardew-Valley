<html lang="en" data-season="spring" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stardew Year 1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5a9e4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f0e8;--surf:#fff;--text:#3d2b1f;--muted:#8a7a6a;
  --acc:#5a9e4a;--acc2:#c85fa8;--border:#e0d8c8;
  --tk-bg:#5a9e4a;--tk-text:#fff;
  --nav-bg:rgba(255,255,255,0.96);--nav-act:#5a9e4a;
  --r:12px;--gap:12px;
  --t-fire:#e53935;--t-prep:#f57c00;--t-gather:#388e3c;
  --t-plate:#7b1fa2;--t-purchase:#1565c0;--t-par:#f9a825;--t-tomorrow:#546e7a;
}
html[data-season=summer]{--acc:#e8960a;--acc2:#1976d2;--tk-bg:#e8960a;}
html[data-season=fall]{--acc:#d4622d;--acc2:#8b4513;--tk-bg:#c4521d;}
html[data-season=winter]{--acc:#4a90d9;--acc2:#9b59b6;--tk-bg:#3a80c9;--bg:#e8eef8;}
html[data-dark=true]{--bg:#1a1a2e;--surf:#16213e;--text:#e2e2e2;--muted:#7a8a9a;--border:#2a3a5e;--nav-bg:rgba(22,33,62,0.97);}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;overflow:hidden;}

#ticker{
  background:var(--tk-bg);color:var(--tk-text);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  font-weight:600;font-size:15px;flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top));
}
#ticker-right{display:flex;gap:10px;align-items:center;}
#dark-btn{background:none;border:none;color:var(--tk-text);font-size:18px;cursor:pointer;padding:0;line-height:1;}
#bridge-dot{width:8px;height:8px;border-radius:50%;background:#ff5252;flex-shrink:0;}
#bridge-dot.ok{background:#69f0ae;}

#main{flex:1;overflow:hidden;position:relative;}
.panel{position:absolute;inset:0;overflow-y:auto;padding:var(--gap);display:none;-webkit-overflow-scrolling:touch;}
.panel.active{display:block;}
.panel-title{font-size:18px;font-weight:700;margin-bottom:var(--gap);color:var(--acc);}

#nav{
  display:flex;background:var(--nav-bg);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:10px;font-weight:500;
}
.nav-btn .icon{font-size:20px;}
.nav-btn.active{color:var(--nav-act);}

.route-day{background:var(--surf);border-radius:var(--r);border:1px solid var(--border);margin-bottom:8px;overflow:hidden;}
.day-header{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;font-weight:600;}
.day-num{background:var(--acc);color:#fff;border-radius:6px;padding:2px 7px;font-size:13px;font-weight:700;flex-shrink:0;}
.route-day.today .day-num{background:var(--acc2);}
.day-name{flex:1;font-size:14px;}
.day-event{font-size:10px;background:var(--acc2);color:#fff;border-radius:10px;padding:1px 6px;flex-shrink:0;}
.day-arrow{color:var(--muted);font-size:11px;transition:transform .2s;flex-shrink:0;}
.route-day[data-open=true] .day-arrow{transform:rotate(90deg);}
.day-body{display:none;border-top:1px solid var(--border);}
.route-day[data-open=true] .day-body{display:block;}

.task-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-check{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);background:var(--surf);flex-shrink:0;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.task-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);}
.task-check[data-checked="1"]::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.task-label{flex:1;font-size:13.5px;line-height:1.4;}
.task-row[data-checked="1"] .task-label{color:var(--muted);text-decoration:line-through;}
.type-badge{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;color:#fff;flex-shrink:0;margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.tb-fire{background:var(--t-fire);}
.tb-prep{background:var(--t-prep);}
.tb-gather{background:var(--t-gather);}
.tb-plate{background:var(--t-plate);}
.tb-purchase{background:var(--t-purchase);}
.tb-par{background:var(--t-par);}
.tb-tomorrow{background:var(--t-tomorrow);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;background:var(--surf);border:1px solid var(--border);position:relative;cursor:pointer;}
.cal-day.today{background:var(--acc);color:#fff;border-color:var(--acc);}
.cal-day.past{color:var(--muted);}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--acc2);}
.cal-day.today.has-event::after{background:#fff;}
.event-list{margin-top:8px;}
.event-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.event-item:last-child{border-bottom:none;}
.event-dot{width:8px;height:8px;border-radius:50%;background:var(--acc2);flex-shrink:0;}
.event-d{font-weight:700;min-width:24px;color:var(--acc);}

.par-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.par-item:last-child{border-bottom:none;}
.par-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.par-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);}
.par-check[data-checked="1"]::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.par-day{font-size:11px;color:var(--muted);margin-left:auto;flex-shrink:0;}

.carry-section{margin-bottom:16px;}
.carry-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.carry-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.carry-item:last-child{border-bottom:none;}
.carry-check{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.carry-check[data-checked="1"]{background:var(--acc);border-color:var(--acc);}
.carry-check[data-checked="1"]::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}

.bridge-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.bridge-row label{font-size:12px;font-weight:600;color:var(--muted);}
.bridge-input{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);width:100%;}
.bridge-btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.bridge-status{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);font-family:monospace;margin-top:8px;min-height:60px;white-space:pre-wrap;word-break:break-all;}

.junimo{position:fixed;pointer-events:none;z-index:1000;width:32px;height:32px;animation:jh .6s ease-in-out infinite alternate;}
@keyframes jh{from{transform:translateY(0);}to{transform:translateY(-6px);}}
.particle{position:fixed;pointer-events:none;z-index:999;width:6px;height:6px;border-radius:50%;animation:pf .8s ease-out forwards;}
@keyframes pf{from{transform:translate(0,0) scale(1);opacity:1;}to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}}
</style>
</head>

<div id="ticker">
  <span id="ticker-text">Spring 1 · Year 1</span>
  <div id="ticker-right">
    <div id="bridge-dot" title="Bridge"></div>

  </div>
</div>

    </div>
    <button class="bridge-btn" id="bridge-connect">Connect</button>
    <div class="bridge-status" id="bridge-status">Not connected</div>
  </div>
</main>

<nav id="nav">
  <button class="nav-btn active" data-tab="route"><span class="icon">📅</span>Route</button>
  <button class="nav-btn" data-tab="cal"><span class="icon">🗓</span>Cal</button>

    {id:'coffee',label:'Coffee (speed boost — NEVER sell)'},
    {id:'spicyeel',label:'Spicy Eel (luck + speed — NEVER sell)'},
    {id:'food',label:'High-energy food (Fried Egg, Salad, Chub)'},
  ],
  'Community Center':[
    {id:'goldcrops',label:'5x Gold Star each: Parsnip, Potato, Cauliflower, Melon, Pumpkin, Corn'},
    {id:'prismatic',label:'Prismatic Shard (for vault or CC display)'},
    {id:'nautilus',label:'Nautilus Shell (Field Research bundle)'},
    {id:'sunflower',label:'Sunflower (Dye Bundle)'},
    {id:'duckfeather',label:'Duck Feather (Dye Bundle — needs Duck in Year 1)'},
    {id:'seaurchin',label:'Sea Urchin (Dye Bundle — submarine fishing, Night Market)'},
  ],
  'NPC Gifts':[
    {id:'diamonds',label:'Diamonds (loved by Maru, Gus, Evelyn, Emily, Willy)'},
    {id:'gems',label:'Amethyst, Aquamarine, Ruby, Emerald, Topaz for birthdays'},
    {id:'wine',label:'Artisan wine (Harvey, Leah loved gifts)'},
  ],
};

const lsGet=k=>localStorage.getItem(k);
const lsSet=(k,v)=>localStorage.setItem(k,v);
const lsTgl=k=>{const v=lsGet(k)==='1';lsSet(k,v?'0':'1');return !v;};

function renderTicker(){
  const n={spring:'Spring',summer:'Summer',fall:'Fall',winter:'Winter'};
  document.getElementById('ticker-text').textContent=`${n[S.season]} ${S.day} · Year 1`;
  document.documentElement.dataset.season=S.season;
}

function renderRoute(){
  const list=document.getElementById('route-list');
  const days=RD[S.season];
  const frag=document.createDocumentFragment();
  days.forEach(day=>{
    const isToday=day.d===S.day;
    const card=document.createElement('div');
    card.className='route-day'+(isToday?' today':'');
    card.dataset.open=isToday?'true':'false';
    card.dataset.d=day.d;
    const evts=(EVENTS[S.season]||[]).filter(e=>e.d===day.d);
    const evtHtml=evts.map(e=>`<span class="day-event">${e.name}</span>`).join('');
    card.innerHTML=`<div class="day-header">
      <span class="day-num">${day.d}</span>
      <span class="day-name">${day.name}</span>
      ${evtHtml}
      <span class="day-arrow">▶</span>
    </div>
    <div class="day-body">${day.tasks.map(t=>{
      const ch=lsGet('sdv_t_'+t.id)==='1'?'1':'0';
      return `<div class="task-row" data-checked="${ch}">
        <div class="task-check" data-id="${t.id}" data-checked="${ch}"></div>
        <span class="type-badge tb-${t.type}">${t.type}</span>
        <span class="task-label">${t.label}</span>
      </div>`;
    }).join('')}</div>`;
    frag.appendChild(card);
  });
  list.innerHTML='';
  list.appendChild(frag);
  const todayEl=list.querySelector('.route-day.today');
  if(todayEl) setTimeout(()=>todayEl.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

function renderCal(){
  const evts=EVENTS[S.season]||[];
  const evtDays=new Set(evts.map(e=>e.d));
  let html='<div class="cal-grid">';
  for(let d=1;d<=28;d++){
    const cls=['cal-day',d===S.day?'today':'',d<S.day?'past':'',evtDays.has(d)?'has-event':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" data-cal-d="${d}">${d}</div>`;
  }
  html+='</div><div class="event-list">';
  evts.forEach(e=>{html+=`<div class="event-item"><div class="event-dot"></div><span class="event-d">${e.d}</span><span>${e.name}</span></div>`;});
  html+='</div>';
  document.getElementById('cal-content').innerHTML=html;
}

function renderPar(){
  const html=PAR.map(p=>{
    const ch=lsGet('sdv_par_'+p.id)==='1'?'1':'0';
    return `<div class="par-item">
      <div class="par-check" data-par-id="${p.id}" data-checked="${ch}"></div>
      <span>${p.label}</span>
      <span class="par-day">${p.target}</span>
    </div>`;
  }).join('');
  document.getElementById('par-content').innerHTML=html;
}

function renderCarry(){
  const html=Object.entries(CARRY).map(([sec,items])=>`
    <div class="carry-section">
      <div class="carry-title">${sec}</div>
      ${items.map(item=>{
        const ch=lsGet('sdv_c_'+item.id)==='1'?'1':'0';
        return `<div class="carry-item">
          <div class="carry-check" data-carry-id="${item.id}" data-checked="${ch}"></div>
          <span>${item.label}</span>
        </div>`;
      }).join('')}
    </div>`).join('');
  document.getElementById('carry-content').innerHTML=html;
}

function renderFromData(data){
  if(!data) return;
  const sea=(data.season||'').toLowerCase();
  if(['spring','summer','fall','winter'].includes(sea)) S.season=sea;
  const d=parseInt(data.day);
  if(d>=1&&d<=28) S.day=d;
  document.documentElement.dataset.season=S.season;
  renderTicker(); renderRoute(); renderCal();
}

async function fetchBridge(){
  const ip=S.bridgeIP;
  if(!ip) return;
  const dot=document.getElementById('bridge-dot');
  const status=document.getElementById('bridge-status');
  try{
    const base=ip.startsWith('http')?ip:`https://${ip}`;
    const res=await fetch(`${base}:${BRIDGE_PORT}/data`,{signal:AbortSignal.timeout(8000)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    S.bridge=data; dot.className='ok';
    status.textContent=JSON.stringify(data,null,2);
    renderFromData(data);
  }catch(e){
    dot.className=''; status.textContent=`Error: ${e.message}`;
  }
  S.retryTimer=setTimeout(fetchBridge,RETRY_MS);
}

function goPanel(tab){
  S.tab=tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const panel=document.getElementById('p-'+tab);
  if(panel) panel.classList.add('active');
  const btn=document.querySelector(`.nav-btn[data-tab="${tab}"]`);
  if(btn) btn.classList.add('active');
}

const junimoSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32">
<circle cx="8" cy="9" r="6" fill="#7ec850"/>
<circle cx="6" cy="8" r="1" fill="#222"/>
<circle cx="10" cy="8" r="1" fill="#222"/>
<ellipse cx="8" cy="11" rx="2" ry="1" fill="#5aaa30"/>
<circle cx="4" cy="6" r="2" fill="#7ec850"/>
<circle cx="12" cy="6" r="2" fill="#7ec850"/>
</svg>`;

function spawnJunimo(){
  const el=document.createElement('div');
  el.className='junimo'; el.innerHTML=junimoSVG;
  el.style.left=Math.random()*(window.innerWidth-40)+'px';
  el.style.top=Math.random()*(window.innerHeight*0.5)+20+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4000+Math.random()*3000);
}
function startJunimos(){spawnJunimo();setInterval(()=>{if(Math.random()<0.3)spawnJunimo();},9000);}

function spawnParticles(el){
  const r=el.getBoundingClientRect();
  const cols=['#7ec850','#f5a623','#c85fa8','#4a90d9','#e53935'];
  for(let i=0;i<6;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.cssText=`left:${r.x+r.width/2}px;top:${r.y}px;background:${cols[i%cols.length]};--tx:${(Math.random()-.5)*60}px;--ty:${-(20+Math.random()*40)}px`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),800);
  }
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('.nav-btn[data-tab]');
  if(tab){goPanel(tab.dataset.tab);return;}

  const hdr=e.target.closest('.day-header');
  if(hdr){
    const card=hdr.closest('.route-day');
    card.dataset.open=card.dataset.open==='true'?'false':'true';
    return;
  }

  const tc=e.target.closest('.task-check[data-id]');
  if(tc){
    e.stopPropagation();
    const ch=lsTgl('sdv_t_'+tc.dataset.id)?'1':'0';
    tc.dataset.checked=ch;
    const row=tc.closest('.task-row'); if(row) row.dataset.checked=ch;
    if(ch==='1') spawnParticles(tc);
    return;
  }

  const pc=e.target.closest('.par-check[data-par-id]');
  if(pc){
    const ch=lsTgl('sdv_par_'+pc.dataset.parId)?'1':'0';
    pc.dataset.checked=ch; if(ch==='1') spawnParticles(pc);
    return;
  }

  const cc=e.target.closest('.carry-check[data-carry-id]');
  if(cc){
    const ch=lsTgl('sdv_c_'+cc.dataset.carryId)?'1':'0';
    cc.dataset.checked=ch; if(ch==='1') spawnParticles(cc);
    return;
  }

  if(e.target.closest('#dark-btn')){
    S.dark=!S.dark; lsSet('sdv_dark',S.dark?'1':'0');
    document.documentElement.dataset.dark=S.dark; return;
  }

  if(e.target.closest('#bridge-connect')){
    const ip=document.getElementById('bridge-ip').value.trim();
    if(!ip) return;
    S.bridgeIP=ip; lsSet('sdv_ip',ip);
    clearTimeout(S.retryTimer); fetchBridge(); return;
  }

  const cd=e.target.closest('.cal-day[data-cal-d]');
  if(cd){
    const d=parseInt(cd.dataset.calD);
    const evts=(EVENTS[S.season]||[]).filter(ev=>ev.d===d);
    if(evts.length) alert(evts.map(ev=>ev.name).join('\n'));
    return;
  }
});

function init(){
  const dark=lsGet('sdv_dark');
  if(dark==='1'){S.dark=true;document.documentElement.dataset.dark='true';}
  const ip=lsGet('sdv_ip');
  if(ip){S.bridgeIP=ip;document.getElementById('bridge-ip').value=ip;fetchBridge();}
  renderTicker(); renderRoute(); renderCal(); renderPar(); renderCarry();
  startJunimos();
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
