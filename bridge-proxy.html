<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Bridge Proxy</title></head>
<body>
<script>
const ALLOWED = ['https://cerealbishh.github.io'];

async function sync() {
  try {
    const data = await fetch('/save', {signal: AbortSignal.timeout(7000)}).then(r => r.json());
    ALLOWED.forEach(o => parent.postMessage({type: 'sdv-bridge', data}, o));
  } catch(e) {
    ALLOWED.forEach(o => parent.postMessage({type: 'sdv-bridge-error', msg: e.message}, o));
  }
}

sync();
setInterval(sync, 5000);
</script>
</body>
</html>
